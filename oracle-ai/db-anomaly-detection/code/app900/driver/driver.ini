# v1.3 - app 900 load driver configuration (the demo VM, installed to ~/anomaly/driver.ini by install.sh).
#        NO SECRETS HERE: passwords are read at start from [secrets] file, by the key names below.
#        Everything is UTC. The transaction mix and the daily load shape are fixed in the code (contract
#        section 2 and 3, pre-registered); this file holds the environment and the data ranges.
#        v1.0: first version, 01-Oct-2026.
#        v1.1: search_terms aligned with the product names 88 generates ("<Adjective> <Category> <A999>").
#        v1.2: peak_tps 28 -> 70 (phase 4 tune, 01-Oct-2026); the target must still project AAS < 0.5 at
#              shape 1.0 (checked with tools/anom_soak_check.sh). v1.3: public copy: host name and local-time references removed; [secrets] file is a placeholder: set it to your secrets file.

[target]
# oradb1 / FREEPDB1 as seen from the host (the container's listener is published on localhost:1522)
host = localhost
port = 1522
service = FREEPDB1
user = SHOP_APP
password_key = SHOP_APP_PWD
pool_min = 2
# hard cap 16 (PLAN section 4); must be at least workers + 1 (the DRIVER_CONTROL reader shares the pool)
pool_max = 16
pool_wait_timeout_ms = 5000
# a call that runs longer than this fails (DPY-4024) and counts as an error for the minute
call_timeout_ms = 60000
tcp_connect_timeout_s = 5

[observer]
# ora26ai / ORCLPDB1 as seen from the host
host = localhost
port = 1521
service = ORCLPDB1
user = ANOM_FEED
password_key = ANOM_FEED_PWD
call_timeout_ms = 15000
tcp_connect_timeout_s = 5
# minutes kept in memory while the observer is unreachable (oldest dropped beyond this)
buffer_minutes = 120

[secrets]
# KEY=VALUE lines, mode 600; never committed, never printed
file = <secrets-file>

[load]
# default 6 workers, hard max 16
workers = 6
# the seed of every random draw (mix, think times, parameters, the per-minute shape jitter); recorded in the log
seed = 20261001
# total transactions per second at a 1.0 shape factor and load_pct 100. Contract v1.1 said about 25-30; raised
# to 70 in the phase 4 tune (6 workers: ~86 ms between starts per worker at peak, transactions take ~6-15 ms)
peak_tps = 70
# +/- fraction applied to the shape, drawn once per UTC minute from the seed
jitter = 0.05
# how often SHOP.DRIVER_CONTROL is read, seconds
control_interval_s = 10

[data]
# id ranges of the SHOP seed data (contract section 1); ids are assumed to be 1..n
n_categories = 50
n_products = 20000
n_customers = 200000
# products 1..hot_products are the "hot" items; hot_order_pct of orders include exactly one of them
hot_products = 50
hot_order_pct = 20
max_items = 4
max_qty = 2
# sent in place of one item when DRIVER_CONTROL.error_pct routes an order to fail (PKG_SHOP raises -20001)
unknown_product_id = 99999999
# fragments for "search": upper(name) like '%<term>%'. Names are "<Adjective> <Category> <A999>" (88_anom_shop_seed):
# A and E match most of a category, the adjectives about 1 in 20
search_terms = A,E,ECO,PRO,MAX,LITE,MINI,SMART,ULTRA,CLASSIC,URBAN,STUDIO
pay_methods = CARD,WALLET,BANK
# NEW orders each worker remembers for "pay"
recent_orders = 50

[logging]
file = ~/anomaly/logs/driver.log
level = INFO
# driver.log plus 9 rotated files: 10 x 5 MB
max_bytes = 5242880
backups = 9
